# =============================================================================
# EBA — Alembic Configuration
# =============================================================================

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# As conexões reais são gerenciadas dinamicamente via env.py e app.config
sqlalchemy.url = postgresql+psycopg2://eba_user:password@localhost:5432/eba_dev

[post_write_hooks]
# Formata arquivos de migração gerados com ruff
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

