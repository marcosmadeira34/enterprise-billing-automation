name: EBA CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Lint, Typecheck & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: backend
        run: |
          uv sync --all-extras

      - name: Ruff Lint & Format Check
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy Type Checking
        working-directory: backend
        run: |
          uv run mypy app/

      - name: Bandit Security Scan
        working-directory: backend
        run: |
          uv run bandit -r app/ -c pyproject.toml

  backend-tests:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eba_test
          POSTGRES_USER: eba_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: backend
        run: |
          uv sync --all-extras

      - name: Run Pytest with Coverage
        working-directory: backend
        env:
          APP_ENV: testing
          SECRET_KEY: test_secret_key_minimum_32_characters_long_for_security
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: eba_test
          POSTGRES_USER: eba_user
          POSTGRES_PASSWORD: test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          MINIO_ACCESS_KEY: test_minio_key
          MINIO_SECRET_KEY: test_minio_secret
          CELERY_TASK_ALWAYS_EAGER: "true"
        run: |
          uv run pytest

  frontend-quality:
    name: Frontend Lint & Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Build
        working-directory: frontend
        run: npm run build

